name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish, for example v0.1.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write       # gh release create + asset upload
  id-token: write       # mint the short-lived OIDC token Sigstore/Fulcio signs with (keyless)
  attestations: write   # write the build-provenance attestation to the repo attestation store

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: build assets and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "release tag must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag does not exist on origin" >&2
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "$tag"

          prerelease="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            prerelease="$INPUT_PRERELEASE"
          elif printf '%s' "$tag" | grep -Eq '[-]'; then
            prerelease="true"
          fi

          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify release gates
        run: bash scripts/audit.sh --ci

      - name: Scan tracked text files
        run: ./scripts/secret-scan.sh

      # govulncheck runs in ci.yml but not on the published tag commit, so the
      # exact bits being released were never vuln-scanned. Mirror the ci.yml
      # scan here. Pinned to the same tagged govulncheck as ci.yml (both pinned
      # to v1.3.0 — reproducible scans + supply-chain hygiene on both paths; the
      # vuln DB is still fetched fresh at run time).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Scan released commit for vulnerabilities
        run: govulncheck ./...

      - name: Build release assets
        env:
          NOLE_BUILD_OUT: dist
          NOLE_BUILD_VERSION: ${{ steps.release.outputs.tag }}
        run: ./scripts/check-release-builds.sh

      # ADDITIVE supply-chain provenance over the mandatory SHA256SUMS floor.
      # Keyless (OIDC + Sigstore Fulcio short-lived certs) — no repo Secret is
      # added. The attestations live in the GitHub attestation API, NOT as release
      # assets; `gh attestation verify` resolves them by artifact digest at verify
      # time, so the `gh release create` arg array below is unchanged.
      #
      # `subject-path` accepts multiple newline-separated paths/globs, so a single
      # step attests EACH of the 6 binaries (the per-binary attestation
      # install.sh verifies against the one binary it downloaded) AND the
      # SHA256SUMS FILE itself (so the checksum list is provenance-bound — a
      # verify-the-list-then-trust-hashes path for a future `nole self-update`).
      # NOTE: do NOT use `subject-checksums: dist/SHA256SUMS` here — that input
      # attests the files LISTED IN the sums file (i.e. the binaries again), NOT
      # the SHA256SUMS file as a subject, and it is mutually exclusive with
      # `subject-path`. scripts/install.sh treats verification as OPTIONAL: it
      # runs only when a usable `gh` is present, fails closed on a real mismatch,
      # and soft-skips otherwise so the zero-dependency curl|bash path still
      # installs on SHA256 alone. Pinned to the v4.1.0 commit SHA per GitHub
      # hardening guidance; github-token defaults to github.token.
      - name: Attest release binaries and checksums
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/nole-*
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            dist/nole-*
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --fail-on-no-commits
            --title "Nólë $TAG"
            --notes "$(cat .github/release-preamble.md)"
            --generate-notes
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      # Auto-roll the Homebrew tap (dorukardahan/homebrew-nole) to this release by
      # rendering packaging/homebrew/nole.rb.tmpl with the version + the four
      # published SHA256SUMS and pushing Formula/nole.rb. This is DORMANT until a
      # HOMEBREW_TAP_TOKEN secret (a PAT with contents:write on the tap repo — the
      # default GITHUB_TOKEN cannot write to another repo) is configured; without
      # it the step SKIPS cleanly (the formula is then bumped manually). Prereleases
      # are skipped so the stable tap only tracks stable releases.
      - name: Update Homebrew tap
        if: steps.release.outputs.prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap sync (formula bumped manually)."
            exit 0
          fi
          version="${TAG#v}"
          sha() { awk -v n="  $1" 'index($0, n) {print $1; exit}' dist/SHA256SUMS; }
          da="$(sha nole-darwin-arm64)"; dx="$(sha nole-darwin-amd64)"
          la="$(sha nole-linux-arm64)"; lx="$(sha nole-linux-amd64)"
          for v in "$da" "$dx" "$la" "$lx"; do
            [ -n "$v" ] || { echo "missing a SHA256SUMS entry for the formula" >&2; exit 1; }
          done
          rendered="$(sed \
            -e "s/__VERSION__/${version}/g" \
            -e "s/__SHA_DARWIN_ARM64__/${da}/g" \
            -e "s/__SHA_DARWIN_AMD64__/${dx}/g" \
            -e "s/__SHA_LINUX_ARM64__/${la}/g" \
            -e "s/__SHA_LINUX_AMD64__/${lx}/g" \
            packaging/homebrew/nole.rb.tmpl)"
          tapdir="$(mktemp -d)"
          trap 'rm -rf "$tapdir"' EXIT
          # Authenticate BOTH the clone and the push with the PAT. An anonymous clone
          # of the tap is refused on the runner — git then tries to prompt for a
          # username and fails non-interactively ("could not read Username ... No such
          # device or address"), so configuring the token only AFTER the clone (as an
          # earlier version did) never worked once a real PAT was set.
          #
          # GitHub's Git-over-HTTPS expects BASIC auth (the token as the password),
          # NOT Bearer — Bearer is the REST API scheme and is rejected for git
          # clone/push. Encode "x-access-token:<token>" as a Basic credential, exactly
          # as actions/checkout does. Supply it via GIT_CONFIG_* env so it applies to
          # EVERY git invocation in this step (clone, symbolic-ref, push) with no token
          # in the remote URL, in process args, or in any persisted .git/config — it
          # vanishes with the step's environment.
          # Do NOT add `set -x`/xtrace to this step: it would echo the credential. The
          # base64 form is registered with ::add-mask:: (GitHub masks the raw secret,
          # not its encoding) as belt-and-suspenders.
          basic_cred="$(printf 'x-access-token:%s' "${HOMEBREW_TAP_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_cred}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_cred}"
          git clone --depth 1 "https://github.com/dorukardahan/homebrew-nole.git" "$tapdir"
          # Push to the tap's ACTUAL default branch (don't assume 'main' — pushing a new
          # 'main' to a 'master' repo would silently desync what brew installs).
          tap_branch="$(git -C "$tapdir" symbolic-ref --short HEAD)"
          mkdir -p "$tapdir/Formula"
          printf '%s\n' "$rendered" > "$tapdir/Formula/nole.rb"
          git -C "$tapdir" add Formula/nole.rb
          if git -C "$tapdir" diff --cached --quiet; then
            echo "tap formula already at ${TAG}; nothing to push."
            exit 0
          fi
          git -C "$tapdir" -c user.name="nole-release" -c user.email="release@users.noreply.github.com" \
            commit -m "nole ${TAG}"
          git -C "$tapdir" push origin "HEAD:${tap_branch}"

      # Auto-roll the Scoop bucket (dorukardahan/scoop-nole) to this release by
      # rendering packaging/scoop/nole.json.tmpl with the version + the two published
      # Windows SHA256SUMS and pushing nole.json. In the DEFAULT dormant state (no
      # SCOOP_BUCKET_TOKEN secret) the step SKIPS cleanly (exit 0) before any clone,
      # so a release NEVER fails for lack of it. ACTIVATION ORDER MATTERS: create the
      # bucket repo (dorukardahan/scoop-nole) BEFORE adding the secret (a PAT with
      # contents:write on it — the default GITHUB_TOKEN cannot write to another repo).
      # If the secret is set while the repo is still missing, the clone fails LOUDLY
      # here — the Release is already published (this step is downstream), so nothing
      # is lost; the loud failure is INTENTIONAL: it surfaces a misconfigured PAT/repo
      # rather than silently leaving the bucket stale, the same fail-loud behaviour as
      # the Update Homebrew tap step. See docs/PACKAGING.md + the activation issue.
      # Prereleases are skipped so the stable bucket only tracks stable releases.
      - name: Update Scoop bucket
        if: steps.release.outputs.prerelease != 'true'
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then
            echo "SCOOP_BUCKET_TOKEN not set — skipping Scoop bucket sync (manifest bumped manually)."
            exit 0
          fi
          version="${TAG#v}"
          # Match the EXACT SHA256SUMS line including the .exe suffix — the awk helper
          # substring-matches "  <name>", so dropping .exe would return empty.
          sha() { awk -v n="  $1" 'index($0, n) {print $1; exit}' dist/SHA256SUMS; }
          wx="$(sha nole-windows-amd64.exe)"; wa="$(sha nole-windows-arm64.exe)"
          for v in "$wx" "$wa"; do
            [ -n "$v" ] || { echo "missing a Windows SHA256SUMS entry for the manifest" >&2; exit 1; }
          done
          rendered="$(sed \
            -e "s/__VERSION__/${version}/g" \
            -e "s/__SHA_WIN_AMD64__/${wx}/g" \
            -e "s/__SHA_WIN_ARM64__/${wa}/g" \
            packaging/scoop/nole.json.tmpl)"
          bucketdir="$(mktemp -d)"
          trap 'rm -rf "$bucketdir"' EXIT
          # Authenticate BOTH clone and push with the PAT via GIT_CONFIG_* (Basic auth,
          # NOT Bearer — Bearer is the REST scheme and is rejected for git-over-HTTPS).
          # Identical mechanism to the Update Homebrew tap step; no token in the URL,
          # process args, or any persisted .git/config. The base64 cred is ::add-mask::ed.
          # Do NOT add `set -x` to this step: it would echo the credential.
          basic_cred="$(printf 'x-access-token:%s' "${SCOOP_BUCKET_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_cred}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_cred}"
          git clone --depth 1 "https://github.com/dorukardahan/scoop-nole.git" "$bucketdir"
          # Push to the bucket's ACTUAL default branch (don't assume 'main').
          bucket_branch="$(git -C "$bucketdir" symbolic-ref --short HEAD)"
          printf '%s\n' "$rendered" > "$bucketdir/nole.json"
          git -C "$bucketdir" add nole.json
          if git -C "$bucketdir" diff --cached --quiet; then
            echo "bucket manifest already at ${TAG}; nothing to push."
            exit 0
          fi
          git -C "$bucketdir" -c user.name="nole-release" -c user.email="release@users.noreply.github.com" \
            commit -m "nole ${TAG}"
          git -C "$bucketdir" push origin "HEAD:${bucket_branch}"
